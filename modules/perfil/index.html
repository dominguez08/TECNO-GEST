<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../../" />
    <title>Mi perfil · InventIC</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/static.css" />
    <link rel="stylesheet" href="assets/interface.css" />
    <link rel="stylesheet" href="assets/theme.css" />
    <script src="assets/theme.js"></script>
    <script src="assets/api.js" defer></script>
    <script src="assets/views.js" defer></script>
    <script src="assets/validation.js" defer></script>
    <script src="assets/store.js" defer></script>
    <script src="assets/auth.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body data-page="perfil/index">
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div id="app">
      <main class="surface connection-error">
        <h1>Mi perfil</h1>
        <p>Cargando datos…</p>
      </main>
    </div>
    <template id="contenido">
      <header class="page-title-box">
        <div>
          <h1 class="page-title">Mi perfil</h1>
          <p>Datos personales y preferencias</p>
        </div>
        <div class="page-actions"></div>
      </header>
      <section class="surface profile-card">
        <div class="profile-heading">
          <span class="avatar">{{esc}}</span>
          <div>
            <h2>{{esc2}}</h2>
            <p>{{esc3}}</p>
          </div>
        </div>
        <form data-form="perfil" data-id="{{registro}}">
          <div class="field-grid">{{userFields}} {{passwordFields}}</div>
          <div class="form-footer">
            {{cancelar}}
            <button class="btn btn-primary" type="submit">Guardar</button>
          </div>
        </form>
      </section>
    </template>
    <noscript>Activa JavaScript para consultar los datos del inventario.</noscript>
  </body>
</html>
