<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../../" />
    <title>Reportes de fallas · InventIC</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/static.css" />
    <link rel="stylesheet" href="assets/interface.css" />
    <link rel="stylesheet" href="assets/theme.css" />
    <script src="assets/theme.js"></script>
    <script src="assets/api.js" defer></script>
    <script src="assets/views.js" defer></script>
    <script src="assets/validation.js" defer></script>
    <script src="assets/store.js" defer></script>
    <script src="assets/auth.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body data-page="reportes/create">
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div id="app">
      <main class="surface connection-error">
        <h1>Reportes de fallas</h1>
        <p>Cargando datos…</p>
      </main>
    </div>
    <template id="contenido">
      <header class="page-title-box">
        <div>
          <h1 class="page-title">Reportar falla</h1>
          <p>El equipo pasará a mantenimiento</p>
        </div>
        <div class="page-actions"></div>
      </header>
      <section class="surface">
        <form data-form="reporte" data-id="">
          <div class="field-grid">
            <div class="field">
              <label for="equipo_id">Equipo *</label>
              <select class="form-select" id="equipo_id" name="equipo_id" required>
                <option value="">Seleccionar</option>
                {{opciones_equipo_id}}
              </select>
            </div>
            <div class="field field-wide">
              <label for="descripcion">Descripción de la falla</label>
              <textarea
                class="form-control"
                id="descripcion"
                name="descripcion"
                maxlength="4000"
              ></textarea>
            </div>
          </div>
          <div class="form-footer">
            {{cancelar}}
            <button class="btn btn-primary" type="submit">Guardar</button>
          </div>
        </form>
      </section>
    </template>
    <noscript>Activa JavaScript para consultar los datos del inventario.</noscript>
  </body>
</html>
