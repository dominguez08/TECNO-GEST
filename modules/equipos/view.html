<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../../" />
    <title>Inventario · InventIC</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/static.css" />
    <link rel="stylesheet" href="assets/interface.css" />
    <link rel="stylesheet" href="assets/theme.css" />
    <script src="assets/theme.js"></script>
    <script src="assets/api.js" defer></script>
    <script src="assets/views.js" defer></script>
    <script src="assets/validation.js" defer></script>
    <script src="assets/store.js" defer></script>
    <script src="assets/auth.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body data-page="equipos/view">
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div id="app">
      <main class="surface connection-error">
        <h1>Inventario</h1>
        <p>Cargando datos…</p>
      </main>
    </div>
    <template id="contenido">
      <header class="page-title-box">
        <div>
          <h1 class="page-title">{{titulo}}</h1>
          <p>{{descripcion}}</p>
        </div>
        <div class="page-actions">{{link}}</div>
      </header>
      {{link2}}
      <section class="surface">
        <div class="equipment-hero">
          <div class="equipment-image-frame">{{photo}}</div>
          <div>{{badge}}{{details}}</div>
        </div>
        <h2>Observaciones</h2>
        <p>{{esc}}</p>
      </section>
      <section class="surface">
        <h2>Historial de préstamos</h2>
        {{table}}
      </section>
      <section class="surface">
        <h2>Historial de fallas y mantenimiento</h2>
        {{table2}}
      </section>
    </template>
    <noscript>Activa JavaScript para consultar los datos del inventario.</noscript>
  </body>
</html>
