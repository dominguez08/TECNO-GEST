</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#6f88a8"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fbff"/><text x="45" y="45" class="title">Diagrama de clases y responsabilidades</text><text x="45" y="70" class="subtitle">InventIC IEP San Rafael</text><rect x="55" y="135" width="300" height="138" rx="8" fill="white" stroke="#b9c9da"/><path d="M63,135 h284 a8,8 0 0 1 8,8 v30 h-300 v-30 a8,8 0 0 1 8,-8" fill="#173f73"/><text x="67" y="159" class="head">Autenticación</text><text x="67" y="193" class="body">+ login(email, password)</text><text x="67" y="215" class="body">+ logout()</text><text x="67" y="237" class="body">+ access(rol)</text><text x="67" y="259" class="body">Gestiona sesión y permisos</text><rect x="440" y="135" width="300" height="138" rx="8" fill="white" stroke="#b9c9da"/><path d="M448,135 h284 a8,8 0 0 1 8,8 v30 h-300 v-30 a8,8 0 0 1 8,-8" fill="#286090"/><text x="452" y="159" class="head">Servicios de aplicación</text><text x="452" y="193" class="body">+ rows(sql, params)</text><text x="452" y="215" class="body">+ execute_sql(sql, params)</text><text x="452" y="237" class="body">+ activity(mensaje, equipo)</text><text x="452" y="259" class="body">+ page_start(titulo)</text><rect x="825" y="135" width="300" height="138" rx="8" fill="white" stroke="#b9c9da"/><path d="M833,135 h284 a8,8 0 0 1 8,8 v30 h-300 v-30 a8,8 0 0 1 8,-8" fill="#286090"/><text x="837" y="159" class="head">Equipo</text><text x="837" y="193" class="body">id, codigo, tipo, ubicacion</text><text x="837" y="215" class="body">estado, responsable</text><text x="837" y="237" class="body">+ crear() + editar()</text><text x="837" y="259" class="body">+ consultarDetalle()</text><rect x="1210" y="135" width="280" height="138" rx="8" fill="white" stroke="#b9c9da"/><path d="M1218,135 h264 a8,8 0 0 1 8,8 v30 h-280 v-30 a8,8 0 0 1 8,-8" fill="#286090"/><text x="1222" y="159" class="head">Prestamo</text><text x="1222" y="193" class="body">equipo, usuario, fechas</text><text x="1222" y="215" class="body">+ crear()</text><text x="1222" y="237" class="body">+ devolver()</text><text x="1222" y="259" class="body">+ validarDisponibilidad()</text><rect x="440" y="495" width="300" height="138" rx="8" fill="white" stroke="#b9c9da"/><path d="M448,495 h284 a8,8 0 0 1 8,8 v30 h-300 v-30 a8,8 0 0 1 8,-8" fill="#173f73"/><text x="452" y="519" class="head">Reporte</text><text x="452" y="553" class="body">equipo, usuario, estado</text><text x="452" y="575" class="body">descripcion, fecha</text><text x="452" y="597" class="body">+ registrar()</text><text x="452" y="619" class="body">+ filtrarPeriodo()</text><rect x="825" y="495" width="300" height="138" rx="8" fill="white" stroke="#b9c9da"/><path d="M833,495 h284 a8,8 0 0 1 8,8 v30 h-300 v-30 a8,8 0 0 1 8,-8" fill="#173f73"/><text x="837" y="519" class="head">Mantenimiento</text><text x="837" y="553" class="body">reporte, tecnico</text><text x="837" y="575" class="body">diagnostico, solucion</text><text x="837" y="597" class="body">+ asignar()</text><text x="837" y="619" class="body">+ completar()</text><rect x="1210" y="495" width="280" height="138" rx="8" fill="white" stroke="#b9c9da"/><path d="M1218,495 h264 a8,8 0 0 1 8,8 v30 h-280 v-30 a8,8 0 0 1 8,-8" fill="#607d9b"/><text x="1222" y="519" class="head">Base de datos PDO</text><text x="1222" y="553" class="body">usuarios, equipos</text><text x="1222" y="575" class="body">prestamos, reportes</text><text x="1222" y="597" class="body">mantenimientos</text><text x="1222" y="619" class="body">consultas preparadas</text><path d="M355,204.0 L440,204.0" class="edge"/><text x="377.5" y="199.0" class="label">autoriza</text><path d="M740,204.0 L825,204.0" class="edge"/><text x="762.5" y="199.0" class="label">opera</text><path d="M1125,204.0 L1210,204.0" class="edge"/><text x="1147.5" y="199.0" class="label">disponibilidad</text><path d="M590.0,273 L590.0,495" class="edge"/><text x="595.0" y="380.0" class="label">registra</text><path d="M740,564.0 L825,564.0" class="edge"/><text x="762.5" y="559.0" class="label">origina</text><path d="M1350.0,273 L1350.0,495" class="edge"/><text x="1355.0" y="380.0" class="label">persiste</text><path d="M975.0,633 L1350.0,495" class="edge"/><text x="1167.5" y="560.0" class="label">persiste</text><path d="M590.0,273 L1350.0,495" class="edge"/><text x="975.0" y="380.0" class="label">consulta</text><text x="55" y="885" class="small">El sistema PHP es procedimental: estas clases representan las entidades y servicios reales para documentar responsabilidades y dependencias.</text></svg>